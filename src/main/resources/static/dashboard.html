<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G8 Fitness Pro | Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --brand: #00ff88; --dark-bg: #0f0f0f; --card-bg: #1a1a1a; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* Sidebar Styling */
        .sidebar { height: 100vh; background: #000; border-right: 1px solid #333; padding: 20px; position: fixed; width: 260px; z-index: 1000; }
        .main-content { margin-left: 260px; padding: 40px; min-height: 100vh; }

        /* UI Components */
        .stat-card { background: var(--card-bg); border: 1px solid #333; border-radius: 16px; padding: 20px; }
        .btn-brand { background: var(--brand); color: black; font-weight: bold; border: none; transition: 0.3s; }
        .btn-brand:hover { background: #00cc6d; color: black; transform: translateY(-2px); }

        /* Form Styling */
        .form-control { background: #000; border: 1px solid #333; color: white; padding: 12px; }
        .form-control:focus { background: #050505; color: white; border-color: var(--brand); box-shadow: none; }

        /* Status Badges */
        .status-pill { padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; display: inline-block; }
        .bg-pending { background: rgba(255, 193, 7, 0.1); color: #ffc107; border: 1px solid #ffc107; }
        .bg-present { background: rgba(0, 255, 136, 0.1); color: var(--brand); border: 1px solid var(--brand); }
        .bg-absent { background: rgba(255, 50, 50, 0.1); color: #ff3232; border: 1px solid #ff3232; }

        .table { color: #eee; vertical-align: middle; }
        .modal-content { border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="sidebar">
    <h3 class="fw-bold mb-5 px-3">G8 <span style="color: var(--brand);">FITNESS</span></h3>
    <nav class="nav flex-column gap-2">
        <a class="nav-link text-white bg-dark p-3 rounded" href="#"><i class="bi bi-people-fill me-2"></i> Members</a>
        <a class="nav-link text-secondary p-3" href="#"><i class="bi bi-bar-chart-fill me-2"></i> Analytics</a>
        <a class="nav-link text-danger mt-5 p-3" href="index.html"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
    </nav>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h2 class="fw-bold mb-1">Member Directory</h2>
            <p class="text-secondary mb-0">Manage gym attendance and profiles</p>
        </div>
        <button class="btn btn-brand px-4 py-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#addModal">
            <i class="bi bi-person-plus-fill me-2"></i> Register Member
        </button>
    </div>

    <div class="stat-card">
        <div class="table-responsive">
            <table class="table table-dark table-hover mb-0">
                <thead>
                <tr class="text-secondary border-secondary">
                    <th>NAME & CONTACT</th>
                    <th>CITY</th>
                    <th>STATUS</th>
                    <th class="text-end">ATTENDANCE ACTION</th>
                </tr>
                </thead>
                <tbody id="memberTableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark border-secondary p-2">
            <div class="modal-header border-0">
                <h4 class="modal-title text-brand fw-bold" id="addModalLabel">Member Onboarding</h4>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="small text-secondary mb-1">Full Name</label>
                        <input type="text" id="mName" class="form-control" placeholder="John Doe">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="small text-secondary mb-1">Email Address</label>
                        <input type="email" id="mEmail" class="form-control" placeholder="john@example.com">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="small text-secondary mb-1">Phone Number</label>
                        <input type="text" id="mPhone" class="form-control" placeholder="+1 234 567 890">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="small text-secondary mb-1">Age</label>
                        <input type="number" id="mAge" class="form-control" placeholder="25">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="small text-secondary mb-1">Ht (cm)</label>
                        <input type="text" id="mHeight" class="form-control" placeholder="180">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="small text-secondary mb-1">Wt (kg)</label>
                        <input type="text" id="mWeight" class="form-control" placeholder="75">
                    </div>
                    <div class="col-12 mb-3">
                        <label class="small text-secondary mb-1">Address Line 1</label>
                        <input type="text" id="mAddr1" class="form-control" placeholder="Street name, Apartment">
                    </div>
                    <div class="col-md-8 mb-3">
                        <label class="small text-secondary mb-1">Address Line 2</label>
                        <input type="text" id="mAddr2" class="form-control" placeholder="Locality, Landmark">
                    </div>
                    <div class="col-md-4 mb-4">
                        <label class="small text-secondary mb-1">City</label>
                        <input type="text" id="mCity" class="form-control" placeholder="New York">
                    </div>
                </div>
                <button type="button" onclick="addMember()" class="btn btn-brand w-100 py-3 shadow">
                    SAVE MEMBER PROFILE
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
