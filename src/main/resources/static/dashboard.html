<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>G8 Fitness Pro | Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --brand: #00ff88; --dark-bg: #0f0f0f; --card-bg: #1a1a1a; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Inter', sans-serif; }
        .sidebar { height: 100vh; background: #000; border-right: 1px solid #333; padding: 20px; position: fixed; width: 260px; }
        .main-content { margin-left: 260px; padding: 40px; }
        .stat-card { background: var(--card-bg); border: 1px solid #333; border-radius: 16px; padding: 20px; }
        .btn-brand { background: var(--brand); color: black; font-weight: bold; border: none; }
        .form-control { background: #000; border: 1px solid #333; color: white; }
        .form-control:focus { background: #050505; color: white; border-color: var(--brand); box-shadow: none; }
        .status-pill { padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; }
        .bg-pending { background: rgba(255, 193, 7, 0.1); color: #ffc107; border: 1px solid #ffc107; }
        .bg-present { background: rgba(0, 255, 136, 0.1); color: var(--brand); border: 1px solid var(--brand); }
        .bg-absent { background: rgba(255, 50, 50, 0.1); color: #ff3232; border: 1px solid #ff3232; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3 class="fw-bold mb-5 px-3">G8 <span style="color: var(--brand);">FITNESS</span></h3>
    <nav class="nav flex-column gap-2">
        <a class="nav-link text-white bg-dark p-3 rounded" href="#"><i class="bi bi-people-fill me-2"></i> Members</a>
        <a class="nav-link text-danger mt-5 p-3" href="login.html"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
    </nav>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2>Member Directory</h2>
        <button class="btn btn-brand px-4 py-2" data-bs-toggle="modal" data-bs-target="#addModal">+ Register Member</button>
    </div>

    <div class="stat-card">
        <table class="table table-dark table-hover">
            <thead>
            <tr class="text-secondary">
                <th>NAME & CONTACT</th>
                <th>CITY</th>
                <th>STATUS</th>
                <th class="text-end">ATTENDANCE</th>
            </tr>
            </thead>
            <tbody id="memberTableBody"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark border-secondary p-4">
            <h4 class="mb-4 text-brand">New Member Registration</h4>
            <div class="row">
                <div class="col-md-6 mb-3"><input type="text" id="mName" class="form-control" placeholder="Full Name"></div>
                <div class="col-md-6 mb-3"><input type="email" id="mEmail" class="form-control" placeholder="Email"></div>
                <div class="col-md-6 mb-3"><input type="text" id="mPhone" class="form-control" placeholder="Phone Number"></div>
                <div class="col-md-2 mb-3"><input type="number" id="mAge" class="form-control" placeholder="Age"></div>
                <div class="col-md-2 mb-3"><input type="text" id="mHeight" class="form-control" placeholder="Ht(cm)"></div>
                <div class="col-md-2 mb-3"><input type="text" id="mWeight" class="form-control" placeholder="Wt(kg)"></div>
                <div class="col-12 mb-3"><input type="text" id="mAddr1" class="form-control" placeholder="Address Line 1"></div>
                <div class="col-md-8 mb-3"><input type="text" id="mAddr2" class="form-control" placeholder="Address Line 2"></div>
                <div class="col-md-4 mb-4"><input type="text" id="mCity" class="form-control" placeholder="City"></div>
            </div>
            <button onclick="addMember()" class="btn btn-brand w-100 py-3">COMPLETE REGISTRATION</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
