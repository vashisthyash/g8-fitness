<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login | G8 Fitness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --brand-success: #00ff88;
            --dark-surface: #1a1a1a;
        }

        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: all 0.4s ease;
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 30px;
        }

        .form-control {
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .form-control:focus {
            background: #333;
            border-color: var(--brand-success);
            color: white;
            box-shadow: 0 0 0 0.25rem rgba(0, 255, 136, 0.1);
        }

        .btn-otp {
            background: var(--brand-success);
            border: none;
            color: black;
            font-weight: 700;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-otp:hover {
            background: #00e67a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        #otpSection {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--brand-success);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <div class="brand-logo">
        G8 <span style="color: var(--brand-success);">FITNESS</span>
    </div>

    <h5 class="mb-4 text-secondary">Authorized Access Only</h5>

    <div id="loginSection">
        <div class="text-start mb-1 small text-secondary px-1">Mobile or Email</div>
        <input type="text" id="identifier" class="form-control" placeholder="e.g. +91 9876543210">
        <button onclick="alert('I am working!'); window.location.href='dashboard.html';" class="btn btn-otp">
            VERIFY & ENTER
        </button>
    </div>

    <div id="otpSection">
        <p class="text-secondary small mb-4">A 4-digit code has been sent to your device.</p>
        <div class="d-flex justify-content-between mb-4">
            <input type="text" id="otpCode" class="form-control text-center fs-3 fw-bold" placeholder="· · · ·" maxlength="4" style="letter-spacing: 15px;">
        </div>
        <button id="verifyBtn" onclick="verifyOTP()" class="btn btn-otp">
            Verify & Dashboard
        </button>
        <div class="mt-3">
            <a href="javascript:location.reload()" class="text-secondary small text-decoration-none">Edit Number</a>
        </div>
    </div>
</div>

<script>
    function verifyOTP() {
        // Use an alert first to see if the button is even "alive"
        alert("Button clicked!");
        const code = document.getElementById('otpCode').value;
        if (code === "1234") {
            window.location.href = "dashboard.html";
        } else {
            alert("Wrong code");
        }
    }
</script>

</body>
</html>
