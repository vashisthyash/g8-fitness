# Replace the URL, username, and password with your ACTUAL Render Database Credentials
spring.datasource.url=jdbc:postgresql://your-db-host-name.render.com/g8_fitness_db
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# This line is CRITICAL - it creates the new columns (height, weight, etc.) for you
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect